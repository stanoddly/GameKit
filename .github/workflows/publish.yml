name: Publish Pixely prerelease

on:
  workflow_dispatch:

concurrency:
  group: publish-pixely-prerelease
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          lfs: true

      - name: Select prerelease version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest=0
          while IFS= read -r number; do
            if (( number > latest )); then
              latest=$number
            fi
          done < <(
            git tag --list 'v0.0.*-alpha' |
              sed -nE 's/^v0\.0\.([1-9][0-9]*)-alpha$/\1/p'
          )
          tag="v0.0.$((latest + 1))-alpha"

          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Selected Pixely $version from $GITHUB_SHA."

  validate:
    needs: prepare
    uses: ./.github/workflows/test.yml
    with:
      package_version: ${{ needs.prepare.outputs.version }}

  publish:
    needs:
      - prepare
      - validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      PIXELY_TAG: ${{ needs.prepare.outputs.tag }}
      PIXELY_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Download validated package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Pixely-${{ env.PIXELY_VERSION }}
          path: artifacts/packages

      - name: Create version tag
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$PIXELY_TAG" --message "Pixely $PIXELY_VERSION"
          git push origin "refs/tags/$PIXELY_TAG"

      - name: Request temporary NuGet credential
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: stanoddly

      - name: Publish package and symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push artifacts/packages/Pixely.${{ env.PIXELY_VERSION }}.nupkg
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --symbol-api-key "$NUGET_API_KEY"
          --symbol-source https://api.nuget.org/v3/index.json

      - name: Create GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$PIXELY_TAG"
          --verify-tag
          --prerelease
          --generate-notes
          --title "Pixely $PIXELY_VERSION"
