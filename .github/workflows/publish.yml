name: Publish Pixely prerelease

on:
  workflow_dispatch:

concurrency:
  group: publish-pixely-prerelease
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Verify publication branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Publishing is only allowed from $DEFAULT_BRANCH."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Select prerelease version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest=0
          while IFS= read -r number; do
            if (( number > latest )); then
              latest=$number
            fi
          done < <(
            git tag --list 'v0.0.*-alpha' |
              sed -nE 's/^v0\.0\.([1-9][0-9]*)-alpha$/\1/p'
          )
          tag="v0.0.$((latest + 1))-alpha"

          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Selected Pixely $version from $GITHUB_SHA."

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      PIXELY_TAG: ${{ needs.prepare.outputs.tag }}
      PIXELY_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Pack release
        env:
          REPOSITORY_COMMIT: ${{ github.sha }}
          REPOSITORY_BRANCH: ${{ github.ref }}
        run: >-
          dotnet pack packaging/Pixely/Pixely.Package.csproj
          --configuration Release
          --output artifacts/packages
          --property:PackageVersion=$PIXELY_VERSION
          --property:Version=$PIXELY_VERSION
          --property:RepositoryCommit=$REPOSITORY_COMMIT
          --property:RepositoryBranch=$REPOSITORY_BRANCH
          --property:ContinuousIntegrationBuild=true
          -p:TreatWarningsAsErrors=true

      - name: Create version tag
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$PIXELY_TAG" --message "Pixely $PIXELY_VERSION"
          git push origin "refs/tags/$PIXELY_TAG"

      - name: Request temporary NuGet credential
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: stanoddly

      - name: Publish package and symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push artifacts/packages/Pixely.${{ env.PIXELY_VERSION }}.nupkg
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --symbol-api-key "$NUGET_API_KEY"
          --symbol-source https://api.nuget.org/v3/index.json

      - name: Create GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$PIXELY_TAG"
          --verify-tag
          --prerelease
          --generate-notes
          --title "Pixely $PIXELY_VERSION"
