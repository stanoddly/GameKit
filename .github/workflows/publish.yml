name: Publish Pixely prerelease

on:
  workflow_dispatch:

concurrency:
  group: publish-pixely-prerelease
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Validate publication setup
        shell: bash
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "Set the NUGET_USER repository variable to the nuget.org profile name." >&2
            exit 1
          fi

      - name: Select prerelease version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from main, not $GITHUB_REF." >&2
            exit 1
          fi

          mapfile -t commit_tags < <(
            git tag --points-at "$GITHUB_SHA" --list 'v0.0.*-alpha' |
              grep -E '^v0\.0\.[1-9][0-9]*-alpha$' || true
          )

          if (( ${#commit_tags[@]} > 1 )); then
            echo "The commit has more than one Pixely prerelease tag." >&2
            printf '%s\n' "${commit_tags[@]}" >&2
            exit 1
          fi

          if (( ${#commit_tags[@]} == 1 )); then
            tag="${commit_tags[0]}"
          else
            latest=0
            while IFS= read -r number; do
              if (( number > latest )); then
                latest=$number
              fi
            done < <(
              git tag --list 'v0.0.*-alpha' |
                sed -nE 's/^v0\.0\.([1-9][0-9]*)-alpha$/\1/p'
            )
            tag="v0.0.$((latest + 1))-alpha"
          fi

          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Selected Pixely $version from $GITHUB_SHA."

  validate:
    needs: prepare
    uses: ./.github/workflows/test.yml
    with:
      package_version: ${{ needs.prepare.outputs.version }}

  publish:
    needs:
      - prepare
      - validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      PIXELY_TAG: ${{ needs.prepare.outputs.tag }}
      PIXELY_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Download validated package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Pixely-${{ env.PIXELY_VERSION }}
          path: artifacts/packages

      - name: Verify an existing NuGet version
        shell: bash
        run: |
          set -euo pipefail

          package_url="https://api.nuget.org/v3-flatcontainer/pixely/$PIXELY_VERSION/pixely.$PIXELY_VERSION.nupkg"
          status="$(curl --silent --show-error --location --output /tmp/pixely-existing.nupkg --write-out '%{http_code}' "$package_url")"
          if [[ "$status" == "404" ]]; then
            exit 0
          fi
          if [[ "$status" != "200" ]]; then
            echo "NuGet returned HTTP $status while checking $PIXELY_VERSION." >&2
            exit 1
          fi

          existing_commit="$(unzip -p /tmp/pixely-existing.nupkg Pixely.nuspec | sed -n 's/.*<repository[^>]*commit="\([^"]*\)".*/\1/p')"
          if [[ "$existing_commit" != "$GITHUB_SHA" ]]; then
            echo "Pixely $PIXELY_VERSION already exists from commit $existing_commit, not $GITHUB_SHA." >&2
            exit 1
          fi

      - name: Create or verify version tag
        shell: bash
        run: |
          set -euo pipefail

          if git rev-parse --verify --quiet "refs/tags/$PIXELY_TAG" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "$PIXELY_TAG")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "$PIXELY_TAG points to $tagged_commit instead of $GITHUB_SHA." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$PIXELY_TAG" --message "Pixely $PIXELY_VERSION"
            git push origin "refs/tags/$PIXELY_TAG"
          fi

      - name: Request temporary NuGet credential
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish package and symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push artifacts/packages/Pixely.${{ env.PIXELY_VERSION }}.nupkg
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --symbol-api-key "$NUGET_API_KEY"
          --symbol-source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Verify published NuGet version
        shell: bash
        run: |
          set -euo pipefail

          package_url="https://api.nuget.org/v3-flatcontainer/pixely/$PIXELY_VERSION/pixely.$PIXELY_VERSION.nupkg"
          status=""
          for attempt in {1..12}; do
            status="$(curl --silent --show-error --location --output /tmp/pixely-published.nupkg --write-out '%{http_code}' "$package_url")"
            if [[ "$status" == "200" ]]; then
              break
            fi
            if [[ "$status" != "404" ]]; then
              echo "NuGet returned HTTP $status while verifying $PIXELY_VERSION." >&2
              exit 1
            fi
            sleep 10
          done

          if [[ "$status" != "200" ]]; then
            echo "Pixely $PIXELY_VERSION was not available from NuGet after publication." >&2
            exit 1
          fi

          published_commit="$(unzip -p /tmp/pixely-published.nupkg Pixely.nuspec | sed -n 's/.*<repository[^>]*commit="\([^"]*\)".*/\1/p')"
          if [[ "$published_commit" != "$GITHUB_SHA" ]]; then
            echo "Pixely $PIXELY_VERSION was published from commit $published_commit, not $GITHUB_SHA." >&2
            exit 1
          fi

      - name: Create or verify GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$PIXELY_TAG" >/dev/null 2>&1; then
            is_prerelease="$(gh release view "$PIXELY_TAG" --json isPrerelease --jq '.isPrerelease')"
            if [[ "$is_prerelease" != "true" ]]; then
              echo "The existing GitHub Release for $PIXELY_TAG is not a prerelease." >&2
              exit 1
            fi
          else
            gh release create "$PIXELY_TAG" \
              --verify-tag \
              --prerelease \
              --generate-notes \
              --title "Pixely $PIXELY_VERSION"
          fi
