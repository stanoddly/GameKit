name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04-arm] # ubuntu-latest, windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test GameKit.slnx -p:TreatWarningsAsErrors=true

      - name: Verify conditional logging in Release
        run: dotnet test tests/GameKit.Logging.Tests/GameKit.Logging.Tests.csproj --configuration Release -p:TreatWarningsAsErrors=true

      - name: Publish logging consumer with NativeAOT
        run: dotnet publish tutorials/GameKit.Tutorials.Triangle/GameKit.Tutorials.Triangle.csproj --configuration Release --runtime linux-arm64 -p:TreatWarningsAsErrors=true
